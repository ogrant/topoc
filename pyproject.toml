[project]
name = "topoc"
version = "1.0.0"
description = "Compiles the .topo topology DSL into AMPS XML configuration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pygls>=2.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
topoc = "topoc.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261111",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # returns
    "PT",       # pytest style
    "RUF",      # ruff-specific
]
